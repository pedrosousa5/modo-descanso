<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODO DESCANSO · Aplicativo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React e ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B101D;
            color: #F4F1EA;
        }
        h1, h2, h3, h4, .font-sora {
            font-family: 'Sora', sans-serif;
        }
        .bg-night { background-color: #0B101D; }
        .bg-night-card { background-color: #131B2E; }
        .bg-night-hover:hover { background-color: #1A2540; }
        .text-ivory { color: #F4F1EA; }
        .text-amber-rest { color: #D6A86A; }
        .bg-amber-rest { background-color: #D6A86A; }
        .border-amber-rest { border-color: #D6A86A; }

        @keyframes pulse-gentle {
            0%, 100% { transform: scale(1); opacity: 0.25; }
            50% { transform: scale(1.06); opacity: 0.45; }
        }
        .animate-breathe {
            animation: pulse-gentle 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-night text-ivory min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Helper para renderizar ícones Lucide
        const createIcon = (name) => ({ size = 20, className = "" }) => {
            const data = (window.lucide && window.lucide[name]) || [];
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {data.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
                </svg>
            );
        };

        const Play = createIcon('Play');
        const Pause = createIcon('Pause');
        const Square = createIcon('Square');
        const RotateCcw = createIcon('RotateCcw');
        const ChevronDown = createIcon('ChevronDown');
        const ChevronUp = createIcon('ChevronUp');
        const Shield = createIcon('Shield');
        const Sparkles = createIcon('Sparkles');
        const Headphones = createIcon('Headphones');
        const HelpCircle = createIcon('HelpCircle');
        const ArrowRight = createIcon('ArrowRight');
        const CheckCircle2 = createIcon('CheckCircle2');
        const Mail = createIcon('Mail');
        const LogOut = createIcon('LogOut');
        const ArrowLeft = createIcon('ArrowLeft');

        // Ícone oficial do Google para o botão de autenticação
        const GoogleIcon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" className="shrink-0">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
        );

        const SESSIONS = [
            { 
                id: 'humming-3', 
                name: 'Humming', 
                duration: 3, 
                durationText: '3 min', 
                tag: 'Transição Imediata',
                context: 'Vibração sonora simples para interromper o loop de pensamentos acelerados.' 
            },
            { 
                id: 'onda-5', 
                name: 'ONDA · Respiro', 
                duration: 5, 
                durationText: '5 min', 
                tag: 'Pausa Rápida',
                context: 'Rampa de descida curta para restaurar o eixo no meio da rotina de trabalho.' 
            },
            { 
                id: 'onda-11', 
                name: 'ONDA · Descompressão', 
                duration: 11, 
                durationText: '11 min', 
                tag: 'Fim de Expediente',
                context: 'Transição consciente para desarmar a prontidão do corpo e encerrar o dia.' 
            },
            { 
                id: 'onda-22', 
                name: 'ONDA · Imersão Noturna', 
                duration: 22, 
                durationText: '22 min', 
                tag: 'Antes de Dormir',
                context: 'Condução profunda para desativar o sistema de alerta e preparar para o sono.' 
            }
        ];

        function App() {
            // Estado do usuário autenticado
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('modo_descanso_user');
                return saved ? JSON.parse(saved) : null;
            });

            const [view, setView] = useState(() => {
                return localStorage.getItem('modo_descanso_user') ? 'dashboard' : 'login';
            });

            const [emailInput, setEmailInput] = useState('');
            const [loginError, setLoginError] = useState('');
            const [selectedSession, setSelectedSession] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [timeLeft, setTimeLeft] = useState(0);
            const [totalDuration, setTotalDuration] = useState(0);
            const [completedSessions, setCompletedSessions] = useState(() => {
                const saved = localStorage.getItem('modo_descanso_completed');
                return saved ? JSON.parse(saved) : [];
            });

            const [openUnderstand, setOpenUnderstand] = useState(null);

            // Timer do Player
            useEffect(() => {
                let interval = null;
                if (isPlaying && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && isPlaying) {
                    setIsPlaying(false);
                    if (selectedSession && !completedSessions.includes(selectedSession.id)) {
                        const updated = [...completedSessions, selectedSession.id];
                        setCompletedSessions(updated);
                        localStorage.setItem('modo_descanso_completed', JSON.stringify(updated));
                    }
                }
                return () => clearInterval(interval);
            }, [isPlaying, timeLeft, selectedSession, completedSessions]);

            const [isLoading, setIsLoading] = useState(false);

            // Verificação de acesso via API /api/verify
            const verifyAndLogin = async (email, provider = 'email', defaultName = '') => {
                setIsLoading(true);
                setLoginError('');
                try {
                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.authorized) {
                            const user = {
                                email: data.user?.email || email,
                                name: data.user?.name || defaultName || email.split('@')[0],
                                provider: provider
                            };
                            setCurrentUser(user);
                            localStorage.setItem('modo_descanso_user', JSON.stringify(user));
                            setView('dashboard');
                            setIsLoading(false);
                            return;
                        } else {
                            setLoginError(data.message || 'Nenhuma compra ativa encontrada para este e-mail.');
                            setIsLoading(false);
                            return;
                        }
                    }
                } catch (e) {
                    // Fallback para preview estático
                }

                const fallbackUser = {
                    email: email,
                    name: defaultName || email.split('@')[0],
                    provider: provider
                };
                setCurrentUser(fallbackUser);
                localStorage.setItem('modo_descanso_user', JSON.stringify(fallbackUser));
                setView('dashboard');
                setIsLoading(false);
            };

            // Login com Google
            const handleGoogleLogin = () => {
                // Quando o Google OAuth estiver ativo, este fluxo recebe o email autenticado
                const demoGoogleEmail = 'aluno.demo@gmail.com';
                verifyAndLogin(demoGoogleEmail, 'google', 'Aluno Modo Descanso');
            };

            // Login com E-mail da compra
            const handleEmailLogin = (e) => {
                e.preventDefault();
                if (!emailInput || !emailInput.includes('@')) {
                    setLoginError('Por favor, informe um e-mail válido.');
                    return;
                }
                verifyAndLogin(emailInput.trim().toLowerCase(), 'email');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('modo_descanso_user');
                setView('login');
                setIsPlaying(false);
            };

            const startSession = (session) => {
                setSelectedSession(session);
                setTotalDuration(session.duration * 60);
                setTimeLeft(session.duration * 60);
                setIsPlaying(false);
                setView('player');
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            return (
                <div className="w-full max-w-2xl mx-auto px-4 py-6 md:py-10 flex flex-col min-h-screen justify-between">
                    <div>
                        {/* Header unificado do App */}
                        <header className="flex justify-between items-center border-b border-slate-800/80 pb-4 mb-6">
                            <div className="flex items-center gap-2">
                                <span className="font-sora font-semibold text-lg tracking-tight text-ivory">
                                    MODO<span className="text-amber-rest mx-1">·</span>DESCANSO
                                </span>
                            </div>
                            {currentUser && (
                                <div className="flex items-center gap-3">
                                    <span className="text-xs text-slate-400 hidden sm:inline truncate max-w-[180px]">
                                        {currentUser.email}
                                    </span>
                                    <button 
                                        onClick={handleLogout}
                                        className="text-xs px-3 py-1.5 rounded-lg bg-night-card border border-slate-800 text-slate-400 hover:text-amber-rest hover:border-slate-700 flex items-center gap-1.5 transition-all"
                                        title="Sair da conta"
                                    >
                                        <LogOut size={13} /> Sair
                                    </button>
                                </div>
                            )}
                        </header>

                        {/* TELA 1: LOGIN / ACESSO */}
                        {view === 'login' && (
                            <div className="flex flex-col items-center justify-center py-6 md:py-12 animate-fade-in">
                                <div className="w-full max-w-md bg-night-card border border-slate-800/80 rounded-2xl p-6 md:p-8 flex flex-col gap-6 shadow-xl">
                                    <div className="flex flex-col gap-2 text-center">
                                        <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-amber-rest text-xs mx-auto">
                                            <Sparkles size={13} /> Área do Praticante
                                        </div>
                                        <h1 className="font-sora text-2xl font-bold text-ivory mt-2">
                                            Acesse seu aplicativo
                                        </h1>
                                        <p className="text-slate-400 text-sm">
                                            Entre com o e-mail cadastrado na sua compra para liberar suas conduções guiadas.
                                        </p>
                                    </div>

                                    {/* Botão de Login com Google */}
                                    <div className="flex flex-col gap-4">
                                        <button 
                                            onClick={handleGoogleLogin}
                                            className="w-full py-3 px-4 rounded-xl bg-white text-slate-900 font-medium hover:bg-slate-100 transition-all flex items-center justify-center gap-3 shadow-md active:scale-[0.99]"
                                        >
                                            <GoogleIcon size={18} />
                                            <span>Continuar com o Google</span>
                                        </button>

                                        <div className="flex items-center gap-3 my-1">
                                            <div className="flex-1 h-px bg-slate-800"></div>
                                            <span className="text-xs text-slate-500 uppercase tracking-wider">ou por e-mail</span>
                                            <div className="flex-1 h-px bg-slate-800"></div>
                                        </div>

                                        {/* Formulário de E-mail */}
                                        <form onSubmit={handleEmailLogin} className="flex flex-col gap-3">
                                            <div>
                                                <label className="text-xs text-slate-400 mb-1.5 block">E-mail da compra</label>
                                                <div className="relative">
                                                    <Mail size={16} className="absolute left-3.5 top-3.5 text-slate-500" />
                                                    <input 
                                                        type="email"
                                                        value={emailInput}
                                                        onChange={(e) => setEmailInput(e.target.value)}
                                                        placeholder="seu@email.com"
                                                        className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-night border border-slate-800 text-sm text-ivory placeholder-slate-600 focus:outline-none focus:border-amber-rest transition-all"
                                                    />
                                                </div>
                                                {loginError && (
                                                    <span className="text-xs text-rose-400 mt-1 block">{loginError}</span>
                                                )}
                                            </div>

                                            <button 
                                                type="submit"
                                                disabled={isLoading}
                                                className="w-full py-3 rounded-xl bg-amber-rest text-night font-semibold hover:opacity-90 disabled:opacity-60 transition-all flex items-center justify-center gap-2 mt-1"
                                            >
                                                {isLoading ? 'Verificando acesso...' : 'Acessar Minhas Sessões'} 
                                                {!isLoading && <ArrowRight size={16} />}
                                            </button>
                                        </form>
                                    </div>

                                    <div className="pt-2 border-t border-slate-800/60 text-center">
                                        <p className="text-xs text-slate-500">
                                            Dificuldade para acessar? Nosso suporte libera imediatamente através do WhatsApp oficial da sua compra.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TELA 2: PAINEL DE SESSÕES (DASHBOARD DO ALUNO) */}
                        {view === 'dashboard' && (
                            <div className="flex flex-col gap-6 animate-fade-in">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="font-sora text-2xl font-semibold text-ivory">Escolha sua Pausa</h2>
                                        <p className="text-slate-400 text-sm mt-0.5">Selecione a condução ideal para o seu estado de alerta agora.</p>
                                    </div>
                                    <button 
                                        onClick={() => setView('understand')}
                                        className="text-xs px-3 py-2 rounded-lg bg-night-card border border-slate-800 text-amber-rest hover:border-amber-rest/60 flex items-center gap-1.5 transition-all"
                                    >
                                        <HelpCircle size={14} /> Entender o Método
                                    </button>
                                </div>

                                {/* Banner de Fones Recomendados */}
                                <div className="p-3.5 rounded-xl bg-night-card/70 border border-slate-800/80 flex items-center gap-3 text-xs text-slate-400">
                                    <div className="p-2 rounded-lg bg-amber-rest/10 text-amber-rest shrink-0">
                                        <Headphones size={16} />
                                    </div>
                                    <span>Recomendamos o uso de fones de ouvido para condução binaural e isolamento de ruído.</span>
                                </div>

                                {/* Grid das 4 Sessões */}
                                <div className="flex flex-col gap-3">
                                    {SESSIONS.map((s) => (
                                        <div 
                                            key={s.id} 
                                            onClick={() => startSession(s)}
                                            className="bg-night-card border border-slate-800/90 hover:border-amber-rest/60 p-5 rounded-2xl flex flex-col gap-3 cursor-pointer transition-all bg-night-hover group shadow-md"
                                        >
                                            <div className="flex justify-between items-start">
                                                <div className="flex flex-col">
                                                    <span className="text-[11px] text-amber-rest uppercase tracking-wider font-semibold">
                                                        {s.tag}
                                                    </span>
                                                    <span className="font-sora font-semibold text-xl text-ivory group-hover:text-amber-rest transition-colors">
                                                        {s.name}
                                                    </span>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {completedSessions.includes(s.id) && (
                                                        <span className="flex items-center gap-1 text-[11px] text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded-full border border-emerald-900/50">
                                                            <CheckCircle2 size={11} /> Realizada
                                                        </span>
                                                    )}
                                                    <span className="text-xs px-2.5 py-1 rounded-full bg-night border border-slate-700 text-amber-rest font-mono">
                                                        {s.durationText}
                                                    </span>
                                                </div>
                                            </div>
                                            <p className="text-slate-400 text-sm leading-relaxed">{s.context}</p>
                                            <div className="flex items-center gap-1.5 text-xs font-semibold text-amber-rest pt-1">
                                                <span>Iniciar condução</span>
                                                <ArrowRight size={13} className="group-hover:translate-x-1 transition-transform" />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TELA 3: PLAYER DE CONDUÇÃO */}
                        {view === 'player' && selectedSession && (
                            <div className="flex flex-col items-center justify-center gap-8 py-8 animate-fade-in">
                                <div className="w-full flex justify-start">
                                    <button 
                                        onClick={() => setView('dashboard')}
                                        className="text-xs px-3 py-1.5 rounded-lg bg-night-card border border-slate-800 text-slate-400 hover:text-ivory flex items-center gap-1.5 transition-all"
                                    >
                                        <ArrowLeft size={13} /> Voltar ao Painel
                                    </button>
                                </div>

                                <div className="flex flex-col items-center gap-2 text-center max-w-sm">
                                    <span className="text-amber-rest text-xs uppercase tracking-wider font-semibold">
                                        {selectedSession.tag}
                                    </span>
                                    <h2 className="font-sora text-3xl font-bold text-ivory">{selectedSession.name}</h2>
                                    <p className="text-slate-400 text-sm">{selectedSession.context}</p>
                                </div>

                                {/* Visualizador Circular da Rampa de Descida */}
                                <div className="relative w-56 h-56 rounded-full border-2 border-slate-800 flex flex-col items-center justify-center bg-night-card shadow-2xl overflow-hidden">
                                    <div className="absolute inset-0 rounded-full border-2 border-amber-rest animate-breathe"></div>
                                    <span className="font-sora text-5xl font-bold text-ivory tracking-tight font-mono">
                                        {formatTime(timeLeft)}
                                    </span>
                                    <span className="text-xs text-slate-400 mt-2">de {selectedSession.durationText}</span>
                                </div>

                                {/* Controles do Player */}
                                <div className="flex items-center gap-4">
                                    <button 
                                        onClick={() => setTimeLeft(totalDuration)}
                                        className="p-3.5 rounded-full bg-night-card border border-slate-800 text-slate-300 hover:text-amber-rest hover:border-slate-700 transition-all shadow-md"
                                        title="Reiniciar Sessão"
                                    >
                                        <RotateCcw size={20} />
                                    </button>
                                    <button 
                                        onClick={() => setIsPlaying(!isPlaying)}
                                        className="p-6 rounded-full bg-amber-rest text-night hover:opacity-90 transition-all shadow-xl active:scale-95"
                                        title={isPlaying ? "Pausar" : "Tocar"}
                                    >
                                        {isPlaying ? <Pause size={28} /> : <Play size={28} className="ml-1" />}
                                    </button>
                                    <button 
                                        onClick={() => setView('dashboard')}
                                        className="p-3.5 rounded-full bg-night-card border border-slate-800 text-slate-300 hover:text-rose-400 hover:border-slate-700 transition-all shadow-md"
                                        title="Encerrar"
                                    >
                                        <Square size={20} />
                                    </button>
                                </div>

                                <div className="text-xs text-slate-500 text-center max-w-xs flex items-center justify-center gap-1.5">
                                    <Headphones size={13} className="text-slate-400 shrink-0" />
                                    <span>Ajuste o volume para um nível suave antes de iniciar.</span>
                                </div>

                                {/* Pós-prática se concluída */}
                                {timeLeft === 0 && (
                                    <div className="w-full max-w-md bg-night-card border border-slate-800 p-6 rounded-2xl flex flex-col gap-4 animate-fade-in shadow-xl">
                                        <div className="flex items-center justify-center gap-2 text-emerald-400 text-sm font-semibold">
                                            <CheckCircle2 size={16} /> Prática Concluída
                                        </div>
                                        <p className="text-slate-300 text-sm text-center">
                                            Permita-se ficar alguns instantes em silêncio antes de retomar as atividades.
                                        </p>
                                        <div className="flex gap-2 pt-2">
                                            <button 
                                                onClick={() => setTimeLeft(totalDuration)}
                                                className="flex-1 py-2.5 rounded-xl bg-night border border-slate-700 text-xs font-medium hover:border-amber-rest transition-colors"
                                            >
                                                Repetir
                                            </button>
                                            <button 
                                                onClick={() => setView('dashboard')}
                                                className="flex-1 py-2.5 rounded-xl bg-amber-rest text-night text-xs font-semibold hover:opacity-90 transition-all"
                                            >
                                                Voltar ao Painel
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TELA 4: ENTENDER O MÉTODO */}
                        {view === 'understand' && (
                            <div className="flex flex-col gap-6 animate-fade-in">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="font-sora text-2xl font-semibold text-ivory">Entender a Prática</h2>
                                        <p className="text-slate-400 text-sm">Os fundamentos neurofisiológicos do Modo Descanso.</p>
                                    </div>
                                    <button 
                                        onClick={() => setView('dashboard')}
                                        className="text-xs px-3 py-1.5 rounded-lg bg-night-card border border-slate-800 text-slate-300 hover:text-ivory"
                                    >
                                        Voltar
                                    </button>
                                </div>

                                <div className="flex flex-col gap-3">
                                    {[
                                        { 
                                            q: "O que é o estado de Alerta Ligado?", 
                                            a: "É quando o corpo e a mente permanecem em prontidão excessiva mesmo após o término das exigências do dia. O sistema simpático não desliga sozinho, gerando tensão crônica leve e fadiga ao acordar." 
                                        },
                                        { 
                                            q: "Como funciona a Rampa de Descida?", 
                                            a: "Tentar parar uma mente acelerada de forma abrupta gera frustração. A rampa utiliza frequências sonoras e ritmos respiratórios decrescentes para desacelerar o sistema nervoso gradualmente, sem esforço mental." 
                                        },
                                        { 
                                            q: "Preciso ter experiência prévia com meditação?", 
                                            a: "Não. O Modo Descanso não é meditação contemplativa nem exige esvaziar a mente. Trata-se de uma resposta fisiológica direta: basta colocar os fones e permitir que a condução faça o trabalho." 
                                        },
                                        { 
                                            q: "O que fazer se sentir desconforto ou ansiedade?", 
                                            a: "Interrompa a qualquer momento. O descanso não deve ser forçado. Respire no seu próprio ritmo natural e retome apenas quando se sentir confortável." 
                                        }
                                    ].map((item, index) => (
                                        <div key={index} className="bg-night-card border border-slate-800/80 rounded-xl overflow-hidden shadow-sm">
                                            <button 
                                                onClick={() => setOpenUnderstand(openUnderstand === index ? null : index)}
                                                className="w-full p-4 text-left flex justify-between items-center font-medium text-sm text-ivory hover:text-amber-rest transition-colors"
                                            >
                                                <span>{item.q}</span>
                                                {openUnderstand === index ? <ChevronUp size={16} className="text-amber-rest" /> : <ChevronDown size={16} />}
                                            </button>
                                            {openUnderstand === index && (
                                                <div className="px-4 pb-4 text-slate-400 text-xs md:text-sm border-t border-slate-800/50 pt-3 leading-relaxed">
                                                    {item.a}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Rodapé do App */}
                    <footer className="border-t border-slate-800/80 pt-6 mt-8 text-center text-xs text-slate-500 flex flex-col gap-2">
                        <div className="flex items-center justify-center gap-1.5 text-slate-400">
                            <Shield size={13} className="text-amber-rest" />
                            <span>Ambiente exclusivo para praticantes do Modo Descanso</span>
                        </div>
                        <p>Em caso de crise ou sofrimento emocional agudo, ligue para o CVV 188.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
