<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODO DESCANSO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React e ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B101D;
            color: #F4F1EA;
        }
        h1, h2, h3, h4, .font-sora {
            font-family: 'Sora', sans-serif;
        }
        .bg-night { background-color: #0B101D; }
        .bg-night-card { background-color: #131B2E; }
        .bg-night-hover:hover { background-color: #1A2540; }
        .text-ivory { color: #F4F1EA; }
        .text-amber-rest { color: #D6A86A; }
        .bg-amber-rest { background-color: #D6A86A; }
        .border-amber-rest { border-color: #D6A86A; }
    </style>
</head>
<body class="bg-night text-ivory min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const createIcon = (name) => ({ size = 20, className = "" }) => {
            const data = (window.lucide && window.lucide[name]) || [];
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {data.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
                </svg>
            );
        };

        const Play = createIcon('Play');
        const Pause = createIcon('Pause');
        const Square = createIcon('Square');
        const RotateCcw = createIcon('RotateCcw');
        const ChevronDown = createIcon('ChevronDown');
        const ChevronUp = createIcon('ChevronUp');
        const Shield = createIcon('Shield');
        const Sparkles = createIcon('Sparkles');
        const Clock = createIcon('Clock');
        const Compass = createIcon('Compass');
        const HelpCircle = createIcon('HelpCircle');
        const ArrowRight = createIcon('ArrowRight');
        const CheckCircle2 = createIcon('CheckCircle2');
        const Lock = createIcon('Lock');

        const SESSIONS = [
            { id: 'humming-3', name: 'Humming', duration: 3, durationText: '3 min', context: 'Transição rápida para silenciar o ruído mental imediato.' },
            { id: 'onda-5', name: 'ONDA', duration: 5, durationText: '5 min', context: 'Micro-pausa restauradora para respiro no meio da rotina.' },
            { id: 'onda-11', name: 'ONDA', duration: 11, durationText: '11 min', context: 'Descompressão profunda para o final do expediente.' },
            { id: 'onda-22', name: 'ONDA', duration: 22, durationText: '22 min', context: 'Imersão noturna completa para desacelerar o sistema de alerta.' }
        ];

        function App() {
            const [view, setView] = useState('landing'); // 'landing', 'app', 'session', 'understand'
            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                return localStorage.getItem('modo_descanso_auth') === 'true';
            });
            const [selectedSession, setSelectedSession] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [timeLeft, setTimeLeft] = useState(0);
            const [totalDuration, setTotalDuration] = useState(0);
            const [completedSessions, setCompletedSessions] = useState(() => {
                const saved = localStorage.getItem('modo_descanso_completed');
                return saved ? JSON.parse(saved) : [];
            });
            const [feedback, setFeedback] = useState('');
            const [feedbackSubmitted, setFeedbackSubmitted] = useState(false);
            
            // FAQ & Understand states
            const [openFaq, setOpenFaq] = useState(null);
            const [openUnderstand, setOpenUnderstand] = useState(null);

            // Timer logic
            useEffect(() => {
                let interval = null;
                if (isPlaying && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && isPlaying) {
                    setIsPlaying(false);
                    if (selectedSession && !completedSessions.includes(selectedSession.id)) {
                        const updated = [...completedSessions, selectedSession.id];
                        setCompletedSessions(updated);
                        localStorage.setItem('modo_descanso_completed', JSON.stringify(updated));
                    }
                }
                return () => clearInterval(interval);
            }, [isPlaying, timeLeft, selectedSession, completedSessions]);

            const handleLogin = () => {
                setIsAuthenticated(true);
                localStorage.setItem('modo_descanso_auth', 'true');
                setView('app');
            };

            const startSession = (session) => {
                setSelectedSession(session);
                setTotalDuration(session.duration * 60);
                setTimeLeft(session.duration * 60);
                setIsPlaying(false);
                setFeedbackSubmitted(false);
                setFeedback('');
                setView('session');
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            return (
                <div className="w-full max-w-4xl mx-auto px-4 py-8 flex flex-col gap-8">
                    {/* Header / Nav */}
                    <header className="flex justify-between items-center border-b border-slate-800 pb-4">
                        <div 
                            onClick={() => setView(isAuthenticated ? 'app' : 'landing')}
                            className="cursor-pointer flex items-center gap-2"
                        >
                            <span className="font-sora font-semibold text-xl tracking-tight text-ivory">
                                MODO<span className="text-amber-rest mx-1">·</span>DESCANSO
                            </span>
                        </div>
                        <div className="flex items-center gap-4">
                            {isAuthenticated ? (
                                <button 
                                    onClick={() => setView('app')}
                                    className="text-sm px-4 py-2 rounded-full bg-night-card border border-slate-800 text-amber-rest hover:border-amber-rest transition-all"
                                >
                                    Meu Painel
                                </button>
                            ) : (
                                <button 
                                    onClick={handleLogin}
                                    className="text-sm px-4 py-2 rounded-full bg-amber-rest text-night font-medium hover:opacity-90 transition-all"
                                >
                                    Acessar Conta / Simular
                                </button>
                            )}
                        </div>
                    </header>

                    {/* MAIN VIEW: LANDING PAGE */}
                    {view === 'landing' && (
                        <div className="flex flex-col gap-12 animate-fade-in">
                            {/* Hero */}
                            <div className="flex flex-col md:flex-row gap-8 items-center py-8">
                                <div className="flex flex-col gap-6 flex-1">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-night-card border border-slate-800 text-amber-rest text-xs w-max">
                                        <Sparkles size={14} /> Condução breve para sistemas em alerta
                                    </div>
                                    <h1 className="font-sora text-4xl md:text-5xl font-bold leading-tight text-ivory">
                                        Cansado, mas ainda em alerta?
                                    </h1>
                                    <p className="text-slate-300 text-base md:text-lg leading-relaxed">
                                        Uma pausa guiada para quem precisa desacelerar quando a mente não desliga. Sem diagnósticos, sem fórmulas mágicas e sem promessas irreais.
                                    </p>
                                    <div className="flex flex-wrap gap-4 pt-2">
                                        <button 
                                            onClick={handleLogin}
                                            className="px-6 py-3 rounded-xl bg-amber-rest text-night font-semibold hover:opacity-90 transition-all flex items-center gap-2 shadow-lg"
                                        >
                                            Começar Agora <ArrowRight size={18} />
                                        </button>
                                    </div>
                                </div>
                                <div className="flex-1 w-full bg-night-card border border-slate-800 p-8 rounded-2xl flex flex-col items-center justify-center text-center gap-4 relative overflow-hidden">
                                    <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#D6A86A_1px,transparent_1px)] [background-size:16px_16px]"></div>
                                    <Compass size={48} className="text-amber-rest animate-pulse" />
                                    <h3 className="font-sora font-semibold text-lg">Método ONDA</h3>
                                    <p className="text-slate-400 text-sm max-w-xs">
                                        Alerta Ligado, Rampa de Descida e prática guiada para restaurar o eixo sem esforço.
                                    </p>
                                </div>
                            </div>

                            {/* Sessions Overview */}
                            <div className="flex flex-col gap-6">
                                <h2 className="font-sora text-2xl font-semibold">As Quatro Sessões</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {SESSIONS.map((s) => (
                                        <div key={s.id} className="bg-night-card border border-slate-800 p-6 rounded-xl flex flex-col justify-between gap-4">
                                            <div className="flex justify-between items-start">
                                                <span className="font-sora font-semibold text-xl text-ivory">{s.name}</span>
                                                <span className="text-xs px-2.5 py-1 rounded-full bg-night border border-slate-700 text-amber-rest">
                                                    {s.durationText}
                                                </span>
                                            </div>
                                            <p className="text-slate-400 text-sm">{s.context}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Offer Section */}
                            <div className="bg-night-card border border-amber-rest/30 p-8 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-6">
                                <div className="flex flex-col gap-2">
                                    <span className="text-amber-rest text-xs font-semibold tracking-wider uppercase">Acesso Vitalício</span>
                                    <h3 className="font-sora text-2xl font-bold">Pagamento único, sem assinaturas</h3>
                                    <p className="text-slate-400 text-sm">Garantia de 7 dias. Acesso imediato à plataforma web.</p>
                                </div>
                                <div className="flex flex-col items-center md:items-end gap-3">
                                    <span className="font-sora text-3xl font-bold text-amber-rest">R$ 27</span>
                                    <button 
                                        onClick={handleLogin}
                                        className="px-6 py-3 rounded-xl bg-amber-rest text-night font-semibold hover:opacity-90 transition-all"
                                    >
                                        Garantir Meu Acesso
                                    </button>
                                </div>
                            </div>

                            {/* FAQ Section */}
                            <div className="flex flex-col gap-4">
                               <h2 className="font-sora text-2xl font-semibold">Dúvidas Frequentes</h2>
                               {[
                                   { q: "Como acesso o aplicativo?", a: "O acesso é feito diretamente pelo navegador do seu celular ou computador, sem necessidade de baixar nada nas lojas de aplicativos." },
                                   { q: "O conteúdo funciona offline?", a: "Não prometemos funcionamento offline ou downloads de áudio. É necessária conexão com a internet para reproduzir as sessões." },
                                   { q: "Isto substitui terapia ou tratamento médico?", a: "Não. O Modo Descanso é uma ferramenta de bem-estar para gerenciamento de pausas, não substituindo acompanhamento profissional." }
                               ].map((faq, index) => (
                                   <div key={index} className="bg-night-card border border-slate-800 rounded-xl overflow-hidden">
                                       <button 
                                           onClick={() => setOpenFaq(openFaq === index ? null : index)}
                                           className="w-full p-4 text-left flex justify-between items-center font-medium"
                                       >
                                           <span>{faq.q}</span>
                                           {openFaq === index ? <ChevronUp size={18} className="text-amber-rest" /> : <ChevronDown size={18} />}
                                       </button>
                                       {openFaq === index && (
                                           <div className="px-4 pb-4 text-slate-400 text-sm border-t border-slate-800/50 pt-2">
                                               {faq.a}
                                           </div>
                                       )}
                                   </div>
                               ))}
                            </div>

                            {/* Limits & Safety Warning */}
                            <div className="p-6 rounded-xl bg-night-card border border-slate-800 flex flex-col gap-3 text-xs text-slate-400">
                                <div className="flex items-center gap-2 text-amber-rest font-semibold">
                                    <Shield size={16} /> Aviso de Limites e Segurança
                                </div>
                                <p>
                                    Este produto não realiza diagnósticos e não promete curas ou sono garantido. Caso esteja passando por uma crise severa ou risco imediato, ligue para o CVV 188 (Centro de Valorização da Vida) ou procure ajuda profissional especializada imediatamente.
                                </p>
                            </div>
                        </div>
                    )}

                    {/* AUTHENTICATED VIEW: APP HOME */}
                    {view === 'app' && (
                        <div className="flex flex-col gap-8 animate-fade-in">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h2 className="font-sora text-2xl font-semibold">Escolha sua Pausa</h2>
                                    <p className="text-slate-400 text-sm">Selecione o formato ideal para o seu momento atual.</p>
                                </div>
                                <button 
                                    onClick={() => setView('understand')}
                                    className="text-xs px-3 py-2 rounded-lg bg-night-card border border-slate-800 text-amber-rest hover:border-amber-rest flex items-center gap-1.5"
                                >
                                    <HelpCircle size={14} /> Entender a Prática
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {SESSIONS.map((s) => (
                                    <div 
                                        key={s.id} 
                                        onClick={() => startSession(s)}
                                        className="bg-night-card border border-slate-800 hover:border-amber-rest/50 p-6 rounded-xl flex flex-col justify-between gap-6 cursor-pointer transition-all bg-night-hover"
                                    >
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <span className="font-sora font-semibold text-xl text-ivory block">{s.name}</span>
                                                <span className="text-amber-rest text-xs font-medium">{s.durationText} de condução</span>
                                            </div>
                                            {completedSessions.includes(s.id) && (
                                                <span className="flex items-center gap-1 text-xs text-emerald-400 bg-emerald-950/30 px-2 py-1 rounded-full border border-emerald-900/50">
                                                    <CheckCircle2 size={12} /> Realizada
                                                </span>
                                            )}
                                        </div>
                                        <p className="text-slate-400 text-sm">{s.context}</p>
                                        <div className="flex items-center gap-2 text-xs font-semibold text-amber-rest">
                                            Iniciar Sessão <ArrowRight size={14} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* UNDERSTAND VIEW */}
                    {view === 'understand' && (
                        <div className="flex flex-col gap-6 animate-fade-in">
                            <div className="flex justify-between items-center">
                                <h2 className="font-sora text-2xl font-semibold">Entender a Prática</h2>
                                <button 
                                    onClick={() => setView('app')}
                                    className="text-xs px-3 py-2 rounded-lg bg-night-card border border-slate-800 text-slate-300"
                                >
                                    Voltar ao Início
                                </button>
                            </div>

                            <div className="flex flex-col gap-4">
                                {[
                                    { q: "O que é o estado de Alerta Ligado?", a: "É quando o corpo e a mente permanecem em prontidão excessiva mesmo após o término das exigências do dia, gerando tensão crônica leve e dificuldade de relaxamento." },
                                    { q: "Como funciona a Rampa de Descida?", a: "Em vez de tentar desligar a mente abruptamente, a rampa utiliza estímulos auditivos e respiratórios graduais para desacelerar o sistema nervoso com o mínimo de atrito." },
                                    { q: "O que fazer se sentir desconforto?", a: "Interrompa imediatamente. O descanso não deve ser forçado. Se a mente acelerar ou houver resistência, permita-se apenas respirar no seu próprio ritmo." }
                                ].map((item, index) => (
                                    <div key={index} className="bg-night-card border border-slate-800 rounded-xl overflow-hidden">
                                        <button 
                                            onClick={() => setOpenUnderstand(openUnderstand === index ? null : index)}
                                            className="w-full p-4 text-left flex justify-between items-center font-medium"
                                        >
                                            <span>{item.q}</span>
                                            {openUnderstand === index ? <ChevronUp size={18} className="text-amber-rest" /> : <ChevronDown size={18} />}
                                        </button>
                                        {openUnderstand === index && (
                                            <div className="px-4 pb-4 text-slate-400 text-sm border-t border-slate-800/50 pt-2">
                                                {item.a}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* SESSION PLAYER VIEW */}
                    {view === 'session' && selectedSession && (
                        <div className="flex flex-col items-center justify-center gap-8 py-12 animate-fade-in">
                            <div className="flex flex-col items-center gap-2 text-center">
                                <span className="text-amber-rest text-xs uppercase tracking-wider font-semibold">Sessão Ativa</span>
                                <h2 className="font-sora text-3xl font-bold">{selectedSession.name}</h2>
                                <p className="text-slate-400 text-sm max-w-sm">{selectedSession.context}</p>
                            </div>

                            {/* Visual Player Timer */}
                            <div className="relative w-48 h-48 rounded-full border-2 border-slate-800 flex flex-col items-center justify-center bg-night-card shadow-xl">
                                <div className="absolute inset-0 rounded-full border-2 border-amber-rest animate-pulse opacity-30"></div>
                                <span className="font-sora text-4xl font-bold text-ivory">{formatTime(timeLeft)}</span>
                                <span className="text-xs text-slate-400 mt-1">de {selectedSession.durationText}</span>
                            </div>

                            {/* Controls */}
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setTimeLeft(totalDuration)}
                                    className="p-3 rounded-full bg-night-card border border-slate-800 text-slate-300 hover:text-amber-rest transition-all"
                                    title="Reiniciar"
                                >
                                    <RotateCcw size={20} />
                                </button>
                                <button 
                                    onClick={() => setIsPlaying(!isPlaying)}
                                    className="p-5 rounded-full bg-amber-rest text-night hover:opacity-90 transition-all shadow-lg"
                                >
                                    {isPlaying ? <Pause size={24} /> : <Play size={24} className="ml-0.5" />}
                                </button>
                                <button 
                                    onClick={() => setView('app')}
                                    className="p-3 rounded-full bg-night-card border border-slate-800 text-slate-300 hover:text-red-400 transition-all"
                                    title="Encerrar"
                                >
                                    <Square size={20} />
                                </button>
                            </div>

                            {/* Placeholder Notice */}
                            <div className="text-xs text-slate-500 text-center max-w-xs">
                                Conteúdo em ambiente seguro. Os masters de áudio definitivos serão integrados em breve.
                            </div>

                            {/* Post-practice option if finished */}
                            {timeLeft === 0 && (
                                <div className="w-full max-w-md bg-night-card border border-slate-800 p-6 rounded-xl flex flex-col gap-4 mt-4 animate-fade-in">
                                    <h3 className="font-sora font-semibold text-lg text-center">Pausa Concluída</h3>
                                    <p className="text-slate-400 text-sm text-center">Como você deseja prosseguir?</p>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => setTimeLeft(totalDuration)}
                                            className="flex-1 py-2.5 rounded-lg bg-night border border-slate-700 text-xs font-medium hover:border-amber-rest"
                                        >
                                            Repetir Sessão
                                        </button>
                                        <button 
                                            onClick={() => setView('app')}
                                            className="flex-1 py-2.5 rounded-lg bg-amber-rest text-night text-xs font-semibold hover:opacity-90"
                                        >
                                            Escolher Outra
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="border-t border-slate-800 pt-6 text-center text-xs text-slate-500 flex flex-col gap-2">
                        <p>MODO DESCANSO · Condução breve para estados de alerta.</p>
                        <p>Em caso de risco imediato, ligue CVV 188.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
