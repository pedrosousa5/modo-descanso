        body {

        @keyframes pulse-gentle {
            0%, 100% { transform: scale(1); opacity: 0.25; }
            50% { transform: scale(1.08); opacity: 0.55; }
        }
        .animate-breathe {
            animation: pulse-gentle 6s ease-in-out infinite;
        }

        /* Estrutura 3D do Flip Card */
        .flip-scene {
            perspective: 1600px;
            width: 100%;
        }
        .flip-card {
            position: relative;
            width: 100%;
            transition: transform 0.75s cubic-bezier(0.2, 0.85, 0.25, 1);
            transform-style: preserve-3d;
        }
        .flip-card.is-flipped {
            transform: rotateY(180deg);
        }
        .flip-face {
            width: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: opacity 0.3s ease;
        }
        .flip-card:not(.is-flipped) .flip-back {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            opacity: 0;
            transform: rotateY(180deg);
        }
        .flip-card.is-flipped .flip-front {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            opacity: 0;
        }
        .flip-card.is-flipped .flip-back {
            position: relative;
            pointer-events: auto;
            opacity: 1;
            transform: rotateY(180deg);
        }

        /* Transição suave de slides do carrossel */
        .slide-enter {
            animation: fadeInSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateX(16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Custom range slider para áudio */
        input[type=range] {
            accent-color: #D6A86A;
        }
    </style>
</head>

            });

            // Abre o modal de consentimento apenas quando o usuário está logado e não consentiu
            useEffect(() => {
                if (currentUser && view === 'dashboard') {
                    const savedConsent = localStorage.getItem('modo_descanso_consent');
                    if (!savedConsent) {
                        setShowConsentModal(true);
                    }
                }
            }, [currentUser, view]);

            // Carrossel de Módulos em Tela Cheia
            const [activeCarouselKey, setActiveCarouselKey] = useState(null);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

            // Modal de Apoio & Conta
            const [showSupportModal, setShowSupportModal] = useState(false);
            const [supportView, setSupportView] = useState('menu'); // 'menu', 'install', 'refund'

            // Controle de gesto Swipe (arrastar com o dedo)
            const [touchStartX, setTouchStartX] = useState(null);
            const [touchEndX, setTouchEndX] = useState(null);

            // Player de Áudio
            const [selectedSession, setSelectedSession] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.85);
            const [isMuted, setIsMuted] = useState(false);
            const audioRef = useRef(null);

            const [completedSessions, setCompletedSessions] = useState(() => {
                const saved = localStorage.getItem('modo_descanso_completed');
                return saved ? JSON.parse(saved) : [];
            });

            // Sincronização do Áudio HTML5
            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const updateTime = () => setCurrentTime(audio.currentTime);
                const handleLoadedMetadata = () => setDuration(audio.duration || selectedSession?.duration || 0);
                const handleEnded = () => {
                    setIsPlaying(false);
                    if (selectedSession && !completedSessions.includes(selectedSession.id)) {
                        const updated = [...completedSessions, selectedSession.id];
                        setCompletedSessions(updated);
                        localStorage.setItem('modo_descanso_completed', JSON.stringify(updated));
                    }
                };

                audio.addEventListener('timeupdate', updateTime);
                audio.addEventListener('loadedmetadata', handleLoadedMetadata);
                audio.addEventListener('ended', handleEnded);

                return () => {
                    audio.removeEventListener('timeupdate', updateTime);
                    audio.removeEventListener('loadedmetadata', handleLoadedMetadata);
                    audio.removeEventListener('ended', handleEnded);
                };
            }, [selectedSession, completedSessions]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = isMuted ? 0 : volume;
                }
            }, [volume, isMuted]);

            const verifyAndLogin = async (email, provider = 'email', defaultName = '') => {
                setIsLoading(true);
                setLoginError('');
                try {
                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const data = await response.json();
                    if (response.ok && data.authorized) {
                        const user = {
                            email: data.user?.email || email,

                                                className="w-full py-2.5 px-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-slate-500 text-slate-300 hover:text-ivory font-medium flex items-center justify-center gap-1.5 transition-all text-center"
                                            >
                                                Solicitar Reembolso na Hotmart ↗
                                            </a>
                                        </div>

                                        <button 
                                            onClick={() => setSupportView('menu')}

                                        >
                                            ← Voltar

                                    </div>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
